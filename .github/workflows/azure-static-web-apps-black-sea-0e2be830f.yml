name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # Builds the site without any credentials. This runs for every PR,
  # including Dependabot and fork PRs, so dependency updates are still
  # proven to build even when they cannot deploy a preview.
  build_job:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build Job
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Deploys the prebuilt artifact. It never installs or runs project
  # dependencies, so the deploy token and OIDC token are not exposed to
  # third-party install scripts.
  #
  # Skipped where secrets are unavailable: fork PRs (no OIDC tokens or
  # secrets for forks) and Dependabot-triggered runs (Dependabot cannot
  # read Actions secrets).
  build_and_deploy_job:
    needs: build_job
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # One deploy per environment at a time: a newer push to main or to the
    # same PR supersedes the older one, which Azure would otherwise cancel
    # and report as a failure.
    concurrency:
      group: swa-deploy-${{ github.event_name == 'push' && 'production' || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_SEA_0E2BE830F }}
          action: "upload"
          app_location: "dist" # Pre-built app output directory
          api_location: "" # Api source code path - optional
          output_location: "" # Already built, no nested output
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) return;
            const body = `🚀 **Preview ready!**\n\nYour preview can be viewed at: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('🚀 **Preview ready!**'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  close_pull_request_job:
    # Same fork and Dependabot guards as build_and_deploy_job: those PRs
    # never deployed a preview, and the run would have no secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    concurrency:
      group: swa-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_SEA_0E2BE830F }}
          action: "close"
          app_location: "/"
          github_id_token: ${{ steps.idtoken.outputs.result }}
